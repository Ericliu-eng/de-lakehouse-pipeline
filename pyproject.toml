[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de-lakehouse-pipeline"
version = "0.1.0"
description = "Data Engineering Lakehouse Pipeline Project"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
required-version = "==0.15.8"
target-version = "py310"

[tool.ruff.lint]
# Preserve the baseline used for local validation; do not inherit tool defaults.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# Measure pipeline, serving, and orchestration code; scripts/ holds CLI utilities.
source = ["src", "orchestration"]

[tool.coverage.report]
skip_empty = true

[tool.setuptools.packages.find]
where = ["src"]  # 关键点：告诉工具代码在 src 文件夹里
