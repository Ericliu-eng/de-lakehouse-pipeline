<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Market Data Lakehouse project run flow</title>
  <desc id="desc">Simplified run flow from local setup through ingestion, storage, quality checks, marts, serving, and operations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .section { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 1.2; rx: 12; }
      .section-title { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #334155; letter-spacing: .7px; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; }
      .box-accent { fill: #f0f9ff; stroke: #7dd3fc; }
      .box-store { fill: #f8fafc; stroke: #94a3b8; }
      .box-check { fill: #fef2f2; stroke: #fca5a5; }
      .box-output { fill: #f0fdf4; stroke: #86efac; }
      .box-title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .box-text { font: 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .mono { font: 12.5px Consolas, "Courier New", monospace; fill: #334155; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .note { font: 13px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <text class="title" x="56" y="64">Market Data Lakehouse Run Flow</text>
  <text class="subtitle" x="56" y="92">Local setup, incremental ingestion, quality checks, curated marts, and serving.</text>

  <rect class="section" x="48" y="124" width="1104" height="122"/>
  <text class="section-title" x="72" y="156">SETUP</text>

  <rect class="box box-accent" x="214" y="166" width="200" height="54"/>
  <text class="box-title" x="236" y="189">Environment</text>
  <text class="mono" x="236" y="211">make setup</text>

  <rect class="box box-accent" x="500" y="166" width="200" height="54"/>
  <text class="box-title" x="522" y="189">Database</text>
  <text class="mono" x="522" y="211">make db-up</text>

  <rect class="box box-store" x="786" y="166" width="200" height="54"/>
  <text class="box-title" x="808" y="189">Schema</text>
  <text class="mono" x="808" y="211">make db-migrate</text>

  <path class="arrow" d="M414 193 H500"/>
  <path class="arrow" d="M700 193 H786"/>

  <rect class="section" x="48" y="278" width="1104" height="206"/>
  <text class="section-title" x="72" y="310">INGESTION</text>
  <text class="note" x="874" y="310">Entry point: make run SYMBOL=AAPL</text>

  <rect class="box box-accent" x="84" y="342" width="158" height="70"/>
  <text class="box-title" x="106" y="368">Run CLI</text>
  <text class="mono" x="106" y="393">run_stock()</text>

  <rect class="box" x="284" y="342" width="158" height="70"/>
  <text class="box-title" x="306" y="368">Extract</text>
  <text class="box-text" x="306" y="393">Alpha Vantage</text>

  <rect class="box" x="484" y="342" width="158" height="70"/>
  <text class="box-title" x="506" y="368">Raw JSON</text>
  <text class="box-text" x="506" y="393">Immutable copy</text>

  <rect class="box" x="684" y="342" width="158" height="70"/>
  <text class="box-title" x="706" y="368">Normalize</text>
  <text class="box-text" x="706" y="393">Typed rows</text>

  <rect class="box" x="884" y="342" width="184" height="70"/>
  <text class="box-title" x="906" y="368">Incremental Load</text>
  <text class="box-text" x="906" y="393">Watermark + upsert</text>

  <path class="arrow" d="M242 377 H284"/>
  <path class="arrow" d="M442 377 H484"/>
  <path class="arrow" d="M642 377 H684"/>
  <path class="arrow" d="M842 377 H884"/>

  <rect class="box box-store" x="266" y="436" width="184" height="32"/>
  <text class="box-text" x="286" y="457">market_bars</text>

  <rect class="box box-store" x="508" y="436" width="184" height="32"/>
  <text class="box-text" x="528" y="457">pipeline_metadata</text>

  <rect class="box box-store" x="750" y="436" width="184" height="32"/>
  <text class="box-text" x="770" y="457">load_metadata</text>

  <path class="arrow-soft" d="M976 412 C976 430 842 430 842 436"/>
  <path class="arrow-soft" d="M976 412 C976 430 600 430 600 436"/>
  <path class="arrow-soft" d="M976 412 C976 430 358 430 358 436"/>

  <rect class="section" x="48" y="516" width="1104" height="122"/>
  <text class="section-title" x="72" y="548">DELIVERY</text>

  <rect class="box box-accent" x="172" y="558" width="190" height="54"/>
  <text class="box-title" x="194" y="581">Orchestrate</text>
  <text class="mono" x="194" y="603">make orchestrate</text>

  <rect class="box box-check" x="420" y="558" width="190" height="54"/>
  <text class="box-title" x="442" y="581">Quality Gate</text>
  <text class="box-text" x="442" y="603">Nulls + uniqueness</text>

  <rect class="box box-output" x="668" y="558" width="190" height="54"/>
  <text class="box-title" x="690" y="581">Marts</text>
  <text class="mono" x="690" y="603">make run-marts</text>

  <rect class="box box-output" x="916" y="558" width="190" height="54"/>
  <text class="box-title" x="938" y="581">Serve</text>
  <text class="box-text" x="938" y="603">API + dashboard</text>

  <path class="arrow" d="M362 585 H420"/>
  <path class="arrow" d="M610 585 H668"/>
  <path class="arrow" d="M858 585 H916"/>

  <text class="note" x="56" y="680">Operational commands: make backfill START=... END=...  |  make lint  |  make test</text>
</svg>
