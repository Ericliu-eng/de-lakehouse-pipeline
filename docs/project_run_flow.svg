<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1336" viewBox="0 0 1440 1336" role="img" aria-labelledby="title desc">
  <title id="title">Market Data Lakehouse — project run flow</title>
  <desc id="desc">Set up the environment and PostgreSQL, then run the CLI orchestrator or Dagster job. Ingestion fetches Alpha Vantage prices, saves a daily local JSON file, optionally uploads to S3, validates and types records, and filters by source and symbol watermark. Raw files are overwritten on same-day reruns. S3 upload failures stop ingestion before staging. Market bars, watermark, and load audit commit in one database transaction or roll back together. No new rows means no database writes; orchestration still runs quality checks. After ingestion, quality checks verify non-null and unique keys, non-negative close and volume, and freshness within 14 days for the active source and symbol. Passing checks allow three marts to be rebuilt in a separate transaction. Failed checks stop the rebuild without rolling back committed ingestion. The separately started FastAPI service reads the latest-price mart. Backfill is a separate ingestion command.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52657b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8060b3"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bf5252"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #213349; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -.8px; }
      .subtitle { font-size: 19px; fill: #596b80; }
      .lane { fill: #f7f9fc; stroke: #dce4ed; stroke-width: 1.2; }
      .lane-title { font-size: 17px; font-weight: 700; letter-spacing: 1.3px; }
      .lane-note { font-size: 17px; fill: #63748a; }
      .number { font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #cbd6e3; stroke-width: 1.4; }
      .card-title { font-size: 22px; font-weight: 650; }
      .body { font-size: 18px; fill: #475b72; }
      .small { font-size: 16px; fill: #63748a; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 18px; fill: #2e4964; }
      .mono-small { font-family: Consolas, "Courier New", monospace; font-size: 16px; fill: #2e4964; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #52657b; }
      .flow { fill: none; stroke: #52657b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #8060b3; stroke-width: 1.8; stroke-dasharray: 5 5; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .failure { fill: none; stroke: #bf5252; stroke-width: 2; marker-end: url(#arrow-red); }
      .green { fill: #23785c; }
      .red { fill: #a84646; }
    </style>
  </defs>

  <rect width="1440" height="1336" fill="#ffffff"/>
  <text class="label" x="64" y="39">PROJECT EXECUTION MAP</text>
  <text class="title" x="64" y="83">Market Data Lakehouse</text>
  <text class="subtitle" x="64" y="114">From daily market prices to validated analytical tables and a live query service.</text>

  <!-- One-time prerequisites. -->
  <rect class="lane" x="40" y="146" width="1360" height="112" rx="16"/>
  <circle cx="82" cy="180" r="16" fill="#63748a"/>
  <text class="number" x="82" y="186">1</text>
  <text class="lane-title" x="112" y="186">SETUP</text>
  <text class="lane-note" x="64" y="220">Once per environment</text>
  <rect class="card" x="272" y="166" width="344" height="72" rx="10"/>
  <text class="mono" x="292" y="194">make setup</text>
  <text class="body" x="292" y="222">Configure .env + API key</text>
  <path class="flow" d="M616 202H664"/>
  <rect class="card" x="664" y="166" width="296" height="72" rx="10"/>
  <text class="mono" x="684" y="194">make db-up</text>
  <text class="body" x="684" y="222">Start PostgreSQL 16</text>
  <path class="flow" d="M960 202H1008"/>
  <rect class="card" x="1008" y="166" width="368" height="72" rx="10"/>
  <text class="mono" x="1028" y="194">make db-migrate</text>
  <text class="body" x="1028" y="222">Apply warehouse + mart schemas</text>

  <!-- Orchestration owns ingestion, quality, and the mart build. -->
  <rect x="40" y="282" width="1360" height="112" rx="16" fill="#edf5ff" stroke="#c8ddf4" stroke-width="1.2"/>
  <circle cx="82" cy="316" r="16" fill="#3975b4"/>
  <text class="number" x="82" y="322">2</text>
  <text class="lane-title" x="112" y="322">RUN</text>
  <text class="lane-note" x="64" y="356">Choose one entry</text>
  <text class="label" x="272" y="309">FULL WORKFLOW</text>
  <text class="mono" x="272" y="339" style="font-size:24px;font-weight:700">make orchestrate SYMBOL=AAPL</text>
  <text class="body" x="272" y="370">Ingest → quality gate → build marts</text>
  <path d="M866 304V372" stroke="#c8ddf4"/>
  <text class="label" x="898" y="309">ALTERNATIVE · DAGSTER</text>
  <text class="mono" x="898" y="339">make dagster-dev</text>
  <text class="body" x="898" y="369">Launch stock_lakehouse_job; enable schedule if needed.</text>

  <!-- Solid arrows: execution order. Dashed arrows: optional synchronous S3 hook. -->
  <rect class="lane" x="40" y="418" width="1360" height="420" rx="16"/>
  <path class="flow" d="M392 394V406H248V534H272"/>
  <circle cx="82" cy="452" r="16" fill="#3975b4"/>
  <text class="number" x="82" y="458">3</text>
  <text class="lane-title" x="112" y="458">INGEST</text>
  <text class="lane-note" x="64" y="492">Extract, stage, load</text>
  <text class="mono-small" x="64" y="548">run_stock()</text>
  <text class="small" x="64" y="577">Standalone ingestion:</text>
  <text class="mono-small" x="64" y="602">make run SYMBOL=AAPL</text>
  <text class="label" x="272" y="450">DAILY PRICES · ONE SYMBOL PER RUN</text>

  <rect class="card" x="272" y="478" width="240" height="112" rx="12"/>
  <text class="card-title" x="292" y="510">Extract</text>
  <text class="body" x="292" y="539">Alpha Vantage API</text>
  <text class="small" x="292" y="565">Bounded retries + backoff</text>
  <path class="flow" d="M512 534H560"/>
  <rect class="card" x="560" y="478" width="240" height="112" rx="12"/>
  <text class="card-title" x="580" y="510">Save raw JSON</text>
  <text class="body" x="580" y="539">Daily local file</text>
  <text class="small" x="580" y="565">Same-day reruns overwrite</text>
  <path class="flow" d="M800 534H848"/>
  <rect class="card" x="848" y="478" width="240" height="112" rx="12"/>
  <text class="card-title" x="868" y="510">Validate + type</text>
  <text class="body" x="868" y="539">Required-field checks</text>
  <text class="small" x="868" y="565">Canonical typed records</text>
  <path class="flow" d="M1088 534H1136"/>
  <rect class="card" x="1136" y="478" width="240" height="112" rx="12"/>
  <text class="card-title" x="1156" y="510">Watermark filter</text>
  <text class="mono" x="1156" y="539">ts &gt; watermark</text>
  <text class="small" x="1156" y="565">Per (source, symbol)</text>

  <path class="optional" d="M680 590V616"/>
  <rect x="552" y="616" width="272" height="48" rx="9" fill="#f5f0fc" stroke="#b5a0d5"/>
  <text x="570" y="636" style="font-size:17px;font-weight:650;fill:#6a4c98">Optional S3 raw copy</text>
  <text class="small" x="570" y="655">Upload failure stops ingestion</text>
  <path class="optional" d="M824 640H836V574H848"/>
  <text class="small" x="868" y="626">No new rows?</text>
  <text class="small" x="868" y="649">Skip writes; still run quality.</text>
  <path class="flow" d="M1256 590V684"/>
  <text class="small" x="1272" y="641">New rows</text>

  <!-- Fact rows and both metadata writes share a connection transaction. -->
  <rect x="272" y="684" width="1104" height="120" rx="12" fill="#edf4fa" stroke="#aac3da" stroke-width="1.4"/>
  <text class="label" x="292" y="710">POSTGRESQL · ONE LOAD TRANSACTION</text>
  <text class="small" x="1036" y="710">All writes commit or roll back together</text>
  <rect class="card" x="292" y="726" width="332" height="60" rx="8"/>
  <text class="mono" x="308" y="750">market_bars</text>
  <text class="small" x="308" y="772">Upsert on (ts, symbol)</text>
  <rect class="card" x="648" y="726" width="332" height="60" rx="8"/>
  <text class="mono" x="664" y="750">pipeline_metadata</text>
  <text class="small" x="664" y="772">Advance the source / symbol watermark</text>
  <rect class="card" x="1004" y="726" width="352" height="60" rx="8"/>
  <text class="mono" x="1020" y="750">load_metadata</text>
  <text class="small" x="1020" y="772">Persist successful load audit</text>
  <text class="mono-small" x="580" y="826">Local raw: data/raw/YYYY-MM-DD/SYMBOL/stock.json</text>

  <!-- Quality runs after the load commits, outside its transaction. -->
  <rect class="lane" x="40" y="880" width="1360" height="276" rx="16"/>
  <path class="flow" d="M418 804V934"/>
  <text class="small" x="436" y="861">After ingestion commits</text>
  <circle cx="82" cy="914" r="16" fill="#2d896b"/>
  <text class="number" x="82" y="920">4</text>
  <text class="lane-title" x="112" y="920">DELIVER</text>
  <text class="lane-note" x="64" y="954">Check, build, query</text>
  <text class="small" x="64" y="1008">Quality failure stops</text>
  <text class="small" x="64" y="1032">downstream processing.</text>

  <rect x="272" y="934" width="292" height="144" rx="12" fill="#fffbef" stroke="#dfc77e" stroke-width="1.4"/>
  <text class="card-title" x="292" y="966">Quality gate</text>
  <text class="body" x="292" y="997">Non-null + unique keys</text>
  <text class="body" x="292" y="1026">Close / volume ≥ 0</text>
  <text class="body" x="292" y="1055">Scoped freshness ≤ 14d</text>
  <path class="flow" d="M564 1006H624"/>
  <text class="label green" x="574" y="990">PASS</text>
  <rect x="624" y="934" width="364" height="144" rx="12" fill="#eff9f4" stroke="#9bceb8" stroke-width="1.4"/>
  <text class="card-title" x="644" y="966">Build 3 marts</text>
  <text class="mono-small" x="644" y="997">mart_daily_symbol_summary</text>
  <text class="mono-small" x="644" y="1022">mart_symbol_latest_price</text>
  <text class="mono-small" x="644" y="1047">mart_symbol_volume_rank</text>
  <text class="small" x="644" y="1070">Separate transaction · one commit</text>
  <path class="flow" d="M988 1006H1048"/>
  <text class="label" x="996" y="990">READ</text>
  <text class="label" x="1068" y="918">START SEPARATELY</text>
  <rect x="1048" y="934" width="328" height="144" rx="12" fill="#ffffff" stroke="#9bceb8" stroke-width="1.4"/>
  <text class="card-title" x="1068" y="966">FastAPI + dashboard</text>
  <text class="body" x="1068" y="997">Reads the latest-price mart</text>
  <text class="mono-small" x="1068" y="1026">/latest-price · /dashboard</text>
  <text class="mono-small" x="1068" y="1055">python -m src.serve.api</text>

  <path class="failure" d="M418 1078V1102"/>
  <rect x="272" y="1102" width="716" height="36" rx="8" fill="#fff1f1" stroke="#e2b0b0"/>
  <text x="292" y="1126" class="body red"><tspan font-weight="700">FAIL</tspan><tspan dx="12">Stop before marts; committed ingestion is retained.</tspan></text>
  <text class="small" x="1068" y="1126">Local service · 127.0.0.1:8000</text>

  <!-- Side commands clarify which stages they run. -->
  <rect class="lane" x="40" y="1180" width="1360" height="124" rx="16"/>
  <text class="lane-title" x="64" y="1215">OTHER COMMANDS</text>
  <text class="lane-note" x="64" y="1245">Recovery + checks</text>
  <text class="mono" x="272" y="1214">make backfill START=... END=... SYMBOL=AAPL</text>
  <text class="body" x="272" y="1243">Resume missing dates in the returned API data; ingestion only.</text>
  <text class="small" x="272" y="1277">Manual mart rebuild: make run-marts (bypasses the quality gate)</text>
  <path d="M940 1202V1282" stroke="#dce4ed"/>
  <text class="mono" x="972" y="1214">make lint · make test</text>
  <text class="body" x="972" y="1243">Static checks + automated tests</text>
  <text class="small" x="972" y="1277">make test includes database-backed tests.</text>
</svg>
